name: Verify

on:
  push:
  pull_request:

# Opt into Node 24 for JavaScript actions (e.g. actions/checkout) until Node 24 is the runner default.
# See https://docs.github.com/en/actions/reference/workflows-and-actions/metadata-syntax#runs-for-javascript-actions
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  core-imports:
    name: Core import boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify core import boundaries
        run: pnpm check:core-imports

      - name: Verify web tsconfig aliases match tsconfig.base.json
        run: pnpm check:web-tsconfig-paths

  agent-docs:
    name: Agent docs — frontmatter and routing paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: paths
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'scripts/check-agent-docs.ts'
              - 'scripts/check-object-create-playbooks.ts'
              - 'scripts/sync-odl-skills.ts'
              - 'scripts/check-core-imports.ts'
              - 'libs/knowledge/**'
              - 'libs/core/**'
              - 'libs/odl-db-types/**'
              - 'apps/web/src/**'
              - 'libs/core/src/object-type-registry/**'
              - 'package.json'

      - uses: pnpm/action-setup@v4
        if: steps.paths.outputs.docs == 'true'

      - uses: actions/setup-node@v4
        if: steps.paths.outputs.docs == 'true'
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        if: steps.paths.outputs.docs == 'true'
        run: pnpm install --frozen-lockfile

      - name: Sync ODL skills catalog
        if: steps.paths.outputs.docs == 'true'
        run: pnpm sync:odl-skills

      - name: Verify agent-oriented docs
        if: steps.paths.outputs.docs == 'true'
        run: pnpm check:agent-docs

      - name: Verify object-create playbooks
        if: steps.paths.outputs.docs == 'true'
        run: pnpm check:object-create-playbooks

  knowledge-unit:
    name: Knowledge lib — unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: paths
        with:
          filters: |
            knowledge:
              - 'libs/knowledge/**'
              - 'apps/knowledge-api/**'
              - 'libs/migrations/src/postgres/odl/00018_knowledge_tables.ts'
              - 'libs/migrations/src/postgres/odl/00019_knowledge_files_description.ts'
              - 'libs/migrations/src/postgres/odl/00020_knowledge_search_hybrid.ts'
              - 'libs/migrations/src/postgres/odl/index.ts'

      - uses: pnpm/action-setup@v4
        if: steps.paths.outputs.knowledge == 'true'

      - uses: actions/setup-node@v4
        if: steps.paths.outputs.knowledge == 'true'
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        if: steps.paths.outputs.knowledge == 'true'
        run: pnpm install --frozen-lockfile

      - name: Unit tests (knowledge)
        if: steps.paths.outputs.knowledge == 'true'
        run: pnpm nx test knowledge && pnpm nx test knowledge-api

  query-api-unit:
    name: Query API — unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: paths
        with:
          filters: |
            query_api:
              - 'apps/query-api/**'
              - 'libs/currency/**'
              - 'libs/objects-domain/**'

      - uses: pnpm/action-setup@v4
        if: steps.paths.outputs.query_api == 'true'

      - uses: actions/setup-node@v4
        if: steps.paths.outputs.query_api == 'true'
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        if: steps.paths.outputs.query_api == 'true'
        run: pnpm install --frozen-lockfile

      - name: Unit tests (query-api)
        if: steps.paths.outputs.query_api == 'true'
        run: pnpm nx test query-api

  agent-wallet:
    name: agent-wallet — unit tests, typecheck, standalone bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: paths
        with:
          filters: |
            agent_wallet:
              - 'apps/agent-wallet/**'
              - 'apps/agent-wallet-e2e/**'
              - 'libs/hive-auth/**'
              - 'libs/hive-broadcast/**'
              - 'libs/hive-account/**'
              - 'libs/common/**'
              - 'scripts/check-standalone-bundle.cjs'

      - uses: pnpm/action-setup@v4
        if: steps.paths.outputs.agent_wallet == 'true'

      - uses: actions/setup-node@v4
        if: steps.paths.outputs.agent_wallet == 'true'
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        if: steps.paths.outputs.agent_wallet == 'true'
        run: pnpm install --frozen-lockfile

      - name: Test, typecheck, build, verify standalone bundle
        if: steps.paths.outputs.agent_wallet == 'true'
        run: |
          pnpm nx test agent-wallet
          pnpm nx run agent-wallet:typecheck
          pnpm exec nx run agent-wallet:build
          pnpm check:standalone-bundle

  nest-typecheck:
    name: Nest apps + clients — TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: paths
        with:
          filters: |
            nest:
              - 'apps/auth-api/**'
              - 'apps/chain-indexer/**'
              - 'apps/query-api/**'
              - 'apps/knowledge-api/**'
              - 'apps/notifications/**'
              - 'apps/ipfs-gateway/**'
              - 'apps/scheduler/**'
              - 'apps/stack-watchdog/**'
              - 'libs/clients/**'
              - 'libs/odl-db-types/**'
              - 'libs/system-alerts/**'
              - 'libs/common/**'
              - 'tsconfig.base.json'
              - 'package.json'
              - 'pnpm-lock.yaml'

      - uses: pnpm/action-setup@v4
        if: steps.paths.outputs.nest == 'true'

      - uses: actions/setup-node@v4
        if: steps.paths.outputs.nest == 'true'
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        if: steps.paths.outputs.nest == 'true'
        run: pnpm install --frozen-lockfile

      - name: Typecheck Nest apps + clients (tsc --noEmit)
        if: steps.paths.outputs.nest == 'true'
        run: pnpm typecheck:nest

  web-verify:
    name: Web — locale JSON UTF-8 + TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify apps/web locale catalogs (strict UTF-8, no BOM, valid JSON)
        run: node scripts/verify-web-locale-json-utf8.cjs

      - name: Typecheck apps/web (tsc --noEmit)
        run: pnpm nx run web:typecheck

  lint:
    name: ESLint — all projects (errors only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails on errors only; existing warnings are tracked separately.
      - name: Lint all projects
        run: pnpm nx run-many -t lint

  migrations-db:
    name: Migrations + scheduler — Postgres integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: paths
        with:
          filters: |
            migrations:
              - 'libs/migrations/**'
              - 'libs/test-postgres/**'
              - 'libs/odl-db-types/**'
              - 'apps/scheduler/**'
              - 'docker-compose.test.yml'

      - uses: pnpm/action-setup@v4
        if: steps.paths.outputs.migrations == 'true'

      - uses: actions/setup-node@v4
        if: steps.paths.outputs.migrations == 'true'
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        if: steps.paths.outputs.migrations == 'true'
        run: pnpm install --frozen-lockfile

      - name: Start test Postgres + Redis
        if: steps.paths.outputs.migrations == 'true'
        run: pnpm test:db:up

      - name: Migrations integration tests
        if: steps.paths.outputs.migrations == 'true'
        env:
          POSTGRES_TEST_URL: postgres://test:test@127.0.0.1:55432/test
        run: pnpm nx test migrations

      - name: scheduler unit + Postgres integration tests
        if: steps.paths.outputs.migrations == 'true'
        env:
          POSTGRES_TEST_URL: postgres://test:test@127.0.0.1:55432/test
        run: pnpm nx test scheduler

      - name: Stop test stack
        if: always() && steps.paths.outputs.migrations == 'true'
        run: pnpm test:db:down

  query-api-e2e:
    name: Query API — e2e + Postgres integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: paths
        with:
          filters: |
            query_api_e2e:
              - 'apps/query-api/**'
              - 'apps/query-api-e2e/**'
              - 'libs/migrations/**'
              - 'libs/odl-db-types/**'
              - 'libs/test-postgres/**'
              - 'docker-compose.test.yml'
              - 'scripts/e2e-query-api.cjs'

      - uses: pnpm/action-setup@v4
        if: steps.paths.outputs.query_api_e2e == 'true'

      - uses: actions/setup-node@v4
        if: steps.paths.outputs.query_api_e2e == 'true'
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        if: steps.paths.outputs.query_api_e2e == 'true'
        run: pnpm install --frozen-lockfile

      - name: Start test Postgres + Redis
        if: steps.paths.outputs.query_api_e2e == 'true'
        run: pnpm test:db:up

      - name: query-api e2e (built server against the test stack)
        if: steps.paths.outputs.query_api_e2e == 'true'
        env:
          POSTGRES_TEST_URL: postgres://test:test@127.0.0.1:55432/test
        run: pnpm nx e2e query-api-e2e

      - name: query-api unit + Postgres integration tests
        if: steps.paths.outputs.query_api_e2e == 'true'
        env:
          POSTGRES_TEST_URL: postgres://test:test@127.0.0.1:55432/test
        run: pnpm nx test query-api

      - name: Stop test stack
        if: always() && steps.paths.outputs.query_api_e2e == 'true'
        run: pnpm test:db:down

  web-instant-e2e:
    name: Web — instant navigation e2e (production build)
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.59 cannot install browsers for.
    # Return to ubuntu-latest after upgrading Playwright to a release that supports it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: paths
        with:
          filters: |
            web_instant:
              - 'apps/web/**'
              - 'apps/web-e2e/**'
              - 'apps/query-api/**'
              - 'libs/**'
              - 'docker-compose.test.yml'

      - uses: pnpm/action-setup@v4
        if: steps.paths.outputs.web_instant == 'true'

      - uses: actions/setup-node@v4
        if: steps.paths.outputs.web_instant == 'true'
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        if: steps.paths.outputs.web_instant == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        if: steps.paths.outputs.web_instant == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Start test Postgres + Redis
        if: steps.paths.outputs.web_instant == 'true'
        run: pnpm test:db:up

      - name: instant() suite (next build + next start, real query-api, test DB)
        if: steps.paths.outputs.web_instant == 'true'
        run: pnpm nx run web-e2e:e2e-instant

      - name: Stop test stack
        if: always() && steps.paths.outputs.web_instant == 'true'
        run: pnpm test:db:down

  osv-scan-pr:
    name: OSV vulnerability scan (PR — new vulns only)
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.3.8
    with:
      scan-args: |-
        --config osv-scanner.toml
        --recursive
        ./

  osv-scan-push:
    name: OSV vulnerability scan (push — full)
    if: github.event_name == 'push'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      scan-args: |-
        --config osv-scanner.toml
        --recursive
        ./
